name: Build Xiaomi Pad 8 Pro

on:
  workflow_dispatch:
    inputs:
      BOOT_CMDLINE:
        description: 'Optional: boot image cmdline'
        required: false
        default: 'console=ttyMSM0,115200n8 rootwait androidboot.hardware=qcom'
      BOOT_BASE:
        description: 'Optional: boot image base address'
        required: false
        default: '0x10000000'
      RAMDISK_PATH:
        description: 'Optional: path to ramdisk in repo (relative)'
        required: false
      KERNEL_REPO:
        description: 'Optional: kernel repo URL (overrides default)'
        required: false
        default: 'https://github.com/code002-2/sm8750-mainline'
      KERNEL_BRANCH:
        description: 'Optional: kernel branch'
        required: false
        default: 'v6.16'
      KERNEL_PATH:
        description: 'Optional: relative path to clone kernel into (under workspace)'
        required: false
        default: 'third_party/kernel'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KERNEL_REPO: ${{ github.event.inputs.KERNEL_REPO || 'https://github.com/code002-2/sm8750-mainline' }}
      KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH || 'main' }}
      KERNEL_DIR: ${{ format('{0}/{1}', github.workspace, github.event.inputs.KERNEL_PATH || 'third_party/kernel') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git debootstrap qemu-user-static abootimg e2fsprogs cpio android-tools-fastboot build-essential zlib1g-dev

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/*.sh

      - name: Build img2simg tool
        run: |
          set -euo pipefail
          echo "Cloning and building img2simg..."
          git clone --depth 1 https://github.com/anestisb/android-simg2img.git /tmp/android-simg2img || true
          if [ -f /tmp/android-simg2img/img2simg.c ]; then
            gcc -O2 -o img2simg /tmp/android-simg2img/img2simg.c -lz || true
            sudo mv img2simg /usr/local/bin/ || true
            sudo chmod +x /usr/local/bin/img2simg || true
            echo "img2simg built and installed"
          else
            echo "img2simg source not found; proceeding without img2simg"
          fi

      - name: Build mkbootimg tool
        run: |
          set -euo pipefail
          echo "Cloning and building mkbootimg..."
          git clone --depth 1 https://android.googlesource.com/platform/system/extras /tmp/mkextras || true
          if [ -f /tmp/mkextras/mkbootimg/mkbootimg.c ]; then
            gcc -O2 -o mkbootimg /tmp/mkextras/mkbootimg/mkbootimg.c -lz || true
            sudo mv mkbootimg /usr/local/bin/ || true
            sudo chmod +x /usr/local/bin/mkbootimg || true
            echo "mkbootimg built and installed"
          else
            echo "mkbootimg source not found; proceeding without mkbootimg"
          fi

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"

      - name: Run build flow
        env:
          DEBIAN_SUITE: bookworm
          ARCH: arm64
          KERNEL_DIR: ${{ github.workspace }}/third_party/kernel
          BOOT_CMDLINE: ${{ github.event.inputs.BOOT_CMDLINE || '' }}
          BOOT_BASE: ${{ github.event.inputs.BOOT_BASE || '' }}
          RAMDISK_PATH: ${{ github.event.inputs.RAMDISK_PATH || '' }}
        run: |
          ./scripts/build.sh

      - name: Package boot and rootfs artifacts
        env:
          BOOT_CMDLINE: ${{ github.event.inputs.BOOT_CMDLINE || '' }}
          BOOT_BASE: ${{ github.event.inputs.BOOT_BASE || '' }}
          RAMDISK_PATH: ${{ github.event.inputs.RAMDISK_PATH || '' }}
        run: |
          chmod +x ./scripts/package_images.sh
          ./scripts/package_images.sh

      - name: Prepare artifacts tarball for release
        run: |
          mkdir -p out/artifacts
          # if boot_piano.img exists, copy it into artifacts for inclusion
          if [ -f out/boot_piano.img ]; then
            mkdir -p out/artifacts
            cp out/boot_piano.img out/artifacts/ || true
          fi
          tar -C out/artifacts -czf out/artifacts_all.tar.gz . || true
          ls -la out || true
          ls -la out/artifacts || true

      - name: Create GitHub Release and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: build-${{ github.run_id }}
          name: Build ${{ github.run_id }}
          artifacts: out/artifacts_all.tar.gz,out/artifacts/boot_piano.img
