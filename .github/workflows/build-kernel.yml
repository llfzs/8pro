name: Build Kernel
on:
  push:
    branches:
      - main
      - piano/ci-packaging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu bc bison flex libssl-dev \
            device-tree-compiler make python3 python3-pip cpio gzip tar xz-utils

      - name: Build kernel
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh kernel

      - name: Package kernel artifacts
        run: |
          ./scripts/build.sh package-kernel

      - name: Create/Update kernel release and upload artifact
        uses: ncipollo/release-action@v1
        with:
          tag: kernel-latest
          artifacts: build/output/kernel-artifacts.tar.gz
          allowUpdates: true
          replacesArtifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
