name: Build Xiaomi Pad 8 Pro Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KERNEL_REPO: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
      KERNEL_BRANCH: v6.12
      KERNEL_DIR: build/linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare apt cache dir
        run: mkdir -p "${GITHUB_WORKSPACE}/.apt-cache"

      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.apt-cache
          key: apt-cache-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          sudo apt-get -o Dir::Cache::archives="${GITHUB_WORKSPACE}/.apt-cache" update -qq
          sudo apt-get -o Dir::Cache::archives="${GITHUB_WORKSPACE}/.apt-cache" install -y -qq \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler bc bison flex libssl-dev libncurses-dev \
            ccache \
            python3 python3-pip wget curl cpio gzip e2fsprogs xz-utils \
            qemu-user-static debootstrap abootimg android-tools-fastboot build-essential zlib1g-dev parted \
            2>/dev/null

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/*.sh

      - name: Resolve kernel commit
        id: kernel-commit
        run: |
          commit=$(git ls-remote "$KERNEL_REPO" "$KERNEL_BRANCH" | awk '{print $1}' | head -n1)
          echo "commit=$commit" >> $GITHUB_OUTPUT

      - name: Cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          key: kernel-${{ steps.kernel-commit.outputs.commit }}-shallow
          restore-keys: |
            kernel-${{ steps.kernel-commit.outputs.commit }}-
            kernel-

      - name: Clone kernel source
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"

      - name: Cache ccache
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-v1

      - name: Restore kernel build outputs
        id: cache-kout
        uses: actions/cache@v4
        with:
          path: |
            build/kout
            build/modules
          key: kernel-kout-${{ env.KERNEL_BRANCH }}-v1
          restore-keys: |
            kernel-kout-${{ env.KERNEL_BRANCH }}-
            kernel-kout-

      - name: Build kernel
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          ./scripts/build.sh kernel

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-kout-${{ env.KERNEL_BRANCH }}
          path: |
            build/kout
            build/modules
          retention-days: 7

      - name: Build boot.img
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          ./scripts/build.sh boot

      - name: Build rootfs.img
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          ./scripts/build.sh rootfs

      - name: Get version info
        id: version
        run: |
          echo "tag=build-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Xiaomi Pad 8 Pro Linux ${{ steps.version.outputs.date }}"
          body: |
            ## Xiaomi Pad 8 Pro - Linux Build

            - **Kernel**: Linux ${{ env.KERNEL_BRANCH }}
            - **Build**: ${{ github.sha }}
          files: |
            build/output/boot.img
            build/output/rootfs.img
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
