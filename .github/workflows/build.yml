name: Build Linux for Xiaomi Pad 8 Pro (piano)
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_rootfs:
        description: 'Build full rootfs (false = kernel only)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu bc bison flex libssl-dev \
            device-tree-compiler make python3 python3-pip cpio gzip tar xz-utils

      - name: Build kernel
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh kernel

      - name: Package kernel artifacts
        run: |
          ./scripts/build.sh package-kernel

      - name: Create/Update kernel release
        uses: ncipollo/release-action@v1
        with:
          tag: kernel-latest
          artifacts: build/output/kernel-artifacts.tar.gz
          allowUpdates: true
          replacesArtifacts: true
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}

  build-rootfs:
    name: Build Rootfs
    needs: build-kernel
    if: ${{ github.event.inputs.build_rootfs != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache BusyBox
        uses: actions/cache@v4
        with:
          path: cache/busybox-aarch64
          key: busybox-aarch64-musl-1.35.0

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq curl tar wget xz-utils qemu-user-static \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler bc bison flex libssl-dev libelf-dev \
            python3 python3-pip android-sdk-libsparse-utils

      - name: Download prebuilt kernel artifacts
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          OWNER_REPO="${GITHUB_REPOSITORY}"
          OWNER=$(echo "$OWNER_REPO" | cut -d'/' -f1)
          REPO=$(echo "$OWNER_REPO" | cut -d'/' -f2)
          TAG="kernel-latest"

          echo "Target kernel release tag: $TAG"
          release_json=$(curl --max-time 20 --retry 3 -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/tags/$TAG")

          if ! echo "$release_json" | jq -e . >/dev/null 2>&1; then
            echo "::error::Failed request GitHub Release API"
            exit 1
          fi

          asset_id=$(echo "$release_json" | jq -r '.assets[] | select(.name | contains("kernel-artifacts")) | .id' | head -n1)
          if [ -z "$asset_id" ] || [ "$asset_id" = "null" ]; then
            echo "::error::No kernel-artifacts.tar.gz found in tag $TAG"
            exit 1
          fi

          curl -L --max-time 30 --retry 3 \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/assets/$asset_id" -o kernel-artifacts.tar.gz

          mkdir -p build
          tar -xzf kernel-artifacts.tar.gz -C build

          IMAGE_PATH=$(find build -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'vmlinuz*' \) -print -quit || true)
          DTB_PATH=$(find build -type f -name '*.dtb' -print -quit || true)

          [ -z "$IMAGE_PATH" ] && { echo "::error::Kernel archive missing Image file!"; exit 1; }

          if [ -z "$DTB_PATH" ] && [ -f dt/sm8750-piano.dts ]; then
            echo "No dtb found, compiling from dt/sm8750-piano.dts"
            dtc -I dts -O dtb -o build/sm8750-piano.dtb dt/sm8750-piano.dts
            DTB_PATH=build/sm8750-piano.dtb
          fi

          [[ "$IMAGE_PATH" == *.gz ]] && gzip -dc "$IMAGE_PATH" > build/Image && IMAGE_PATH=build/Image
          [ "$IMAGE_PATH" != "build/Image" ] && cp "$IMAGE_PATH" build/Image 2>/dev/null || true
          [ ! -f build/sm8750-piano.dtb ] && [ -n "$DTB_PATH" ] && cp "$DTB_PATH" build/sm8750-piano.dtb 2>/dev/null || true

          echo "Kernel extract complete: Image at build/Image, dtb: build/sm8750-piano.dtb"

      - name: Build boot.img + vbmeta.img + rootfs.img
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh deps
          ./scripts/build.sh boot
          ./scripts/build.sh vbmeta
          ./scripts/build.sh rootfs
          ls -lh build/output/

      - name: Compress release artifacts
        run: |
          cd build/output
          gzip -c boot.img > boot.img.gz
          gzip -c rootfs.img > rootfs.img.gz
          ls -lh *.img *.img.gz

      - name: Upload build artifacts to release
        uses: ncipollo/release-action@v1
        with:
          tag: rootfs-latest
          name: RootFS Latest Build #${{ github.run_number }}
          body: |
            Auto build from commit `${{ github.sha }}`
            Kernel tag source: kernel-latest
          artifacts: build/output/boot.img.gz,build/output/rootfs.img.gz,build/output/vbmeta.img
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
