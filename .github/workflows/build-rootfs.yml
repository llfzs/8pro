name: Build Rootfs
on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: 'Kernel release tag'
        required: false
        default: 'kernel-latest'
  push:
    branches:
      - main

permissions:
  contents: write
  # 发布release需要仓库写权限，补充
  packages: write

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 1. 先拉取仓库代码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. 加载BusyBox缓存
      - name: Cache BusyBox static binary
        uses: actions/cache@v4
        with:
          path: cache/busybox-aarch64
          key: busybox-aarch64-musl-1.35.0

      # 3. 完整安装全部构建依赖（补交叉编译、dtc、内核编译工具）
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq curl tar wget xz-utils qemu-user-static \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler bc bison flex libssl-dev libelf-dev python3 python3-pip

      # 4. 拉取预编译内核产物，增加重试、异常捕获
      - name: Download prebuilt kernel artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          OWNER_REPO="${GITHUB_REPOSITORY}"
          OWNER=$(echo "$OWNER_REPO" | cut -d'/' -f1)
          REPO=$(echo "$OWNER_REPO" | cut -d'/' -f2)
          # 区分手动触发/自动push的tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.kernel_tag }}" ]]; then
            TAG="${{ github.event.inputs.kernel_tag }}"
          else
            TAG="kernel-latest"
          fi
          echo "Target kernel release tag: $TAG"
          # API请求增加超时与重试
          release_json=$(curl --max-time 20 --retry 3 -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/tags/$TAG")
          # 校验返回是否合法json
          if ! echo "$release_json" | jq -e . >/dev/null 2>&1; then
            echo "::error::Failed request GitHub Release API"
            echo "$release_json"
            exit 1
          fi
          # 匹配内核压缩包
          asset_id=$(echo "$release_json" | jq -r '.assets[] | select(.name | contains("kernel-artifacts")) | .id' | head -n1)
          if [[ -z "$asset_id" || "$asset_id" == "null" ]]; then
            echo "::error::No kernel-artifacts.tar.gz found in tag $TAG"
            echo "Available assets:"
            echo "$release_json" | jq -r '.assets[].name'
            exit 1
          fi
          echo "Download kernel asset ID: $asset_id"
          curl -L --max-time 30 --retry 3 \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$OWNER/$REPO/releases/assets/$asset_id" -o kernel-artifacts.tar.gz
          # 解压到build目录并校验关键文件
          mkdir -p build
          tar -xzf kernel-artifacts.tar.gz -C build
          echo "List extracted files:"
          find build -maxdepth 4 -type f -print || true
          # 尝试在任何子目录中查找 Image / Image.gz / vmlinuz* 和 dtb
          IMAGE_PATH=$(find build -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'vmlinuz*' \) -print -quit || true)
          DTB_PATH=$(find build -type f -name '*.dtb' -print -quit || true)

          # 必须至少包含内核映像，否则失败
          if [[ -z "$IMAGE_PATH" ]]; then
            echo "::error::Kernel archive missing Image file!"
            echo "Available files under build:" 
            find build -type f -print || true
            exit 1
          fi

          # 如果未包含任何 dtb，则尝试使用仓库中的 dts 编译一个 dtb 作为回退
          if [[ -z "$DTB_PATH" ]]; then
            echo "No dtb found inside kernel archive, attempting to compile dt/xiaomi,pad8pro.dts"
            if [[ -f dt/xiaomi,pad8pro.dts ]]; then
              dtc -I dts -O dtb -o build/xiaomi,pad8pro.dtb dt/xiaomi,pad8pro.dts || {
                echo "::error::dtc failed to compile dtb from dt/xiaomi,pad8pro.dts"
                echo "Available files under build:" 
                find build -type f -print || true
                exit 1
              }
              DTB_PATH=build/xiaomi,pad8pro.dtb
              echo "Compiled fallback dtb -> $DTB_PATH"
            else
              echo "::error::Kernel archive missing dtb and dt/xiaomi,pad8pro.dts not found in repo"
              echo "Available files under build:" 
              find build -type f -print || true
              exit 1
            fi
          fi

          # 如果找到的是压缩的 Image，解压到 build/Image 以供后续使用
          if [[ "$IMAGE_PATH" == *.gz ]]; then
            echo "Decompressing $IMAGE_PATH to build/Image"
            gzip -dc "$IMAGE_PATH" > build/Image
            IMAGE_PATH=build/Image
          fi

          # 确保最终内核镜像位于 build/Image，便于后续脚本直接使用
          if [[ "$IMAGE_PATH" != "build/Image" ]]; then
            cp "$IMAGE_PATH" build/Image 2>/dev/null || true
            IMAGE_PATH=build/Image
          fi

          # 确保 device 特定 dtb 名称存在于 build 根目录（若 DTB_PATH 指向别名则复制）
          if [[ ! -f build/xiaomi,pad8pro.dtb ]]; then
            cp "$DTB_PATH" build/xiaomi,pad8pro.dtb 2>/dev/null || true
            DTB_PATH=build/xiaomi,pad8pro.dtb
          fi

          echo "Kernel extract complete: Image at $IMAGE_PATH, dtb example: $DTB_PATH"

      # 5. 执行构建脚本
      - name: Build boot.img + rootfs.img
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh boot
          ./scripts/build.sh rootfs
          ls -lh build/output/

      # 6. 打包产物，保留原始img+压缩包
      - name: Compress release artifacts
        run: |
          cd build/output
          gzip -c boot.img > boot.img.gz
          gzip -c rootfs.img > rootfs.img.gz
          ls -lh *.img *.img.gz

      # 7. 更新固定latest发布版本，不新建海量tag
      - name: Upload build artifacts to release
        uses: ncipollo/release-action@v1
        with:
          tag: rootfs-latest
          name: RootFS Latest Build #${{ github.run_number }}
          body: |
            Auto build from commit `${{ github.sha }}`
            Workflow run ID: ${{ github.run_id }}
            Kernel tag source: ${{ github.event.inputs.kernel_tag || 'kernel-latest' }}
          artifacts: build/output/boot.img.gz,build/output/rootfs.img.gz
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}